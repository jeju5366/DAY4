<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space Test</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02030a);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 500);
camera.position.set(0, 0, 30);

// 조명 (그림자 없음)
scene.add(new THREE.AmbientLight(0x404060, 0.8));
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(-20, 15, 20);
scene.add(sun);

// 별 (1500개, 단일 Points)
const STAR_COUNT = 1500;
const pos = new Float32Array(STAR_COUNT * 3);
for (let i = 0; i < STAR_COUNT; i++) {
  const r = 120 + Math.random() * 180;
  const t = Math.random() * Math.PI * 2;
  const p = Math.acos(2 * Math.random() - 1);
  pos[i * 3]     = r * Math.sin(p) * Math.cos(t);
  pos[i * 3 + 1] = r * Math.sin(p) * Math.sin(t);
  pos[i * 3 + 2] = r * Math.cos(p);
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 1.2, sizeAttenuation: false }));
scene.add(stars);

// 천체 3개 (저폴리 구, 텍스처 없음)
function makePlanet(radius, color, x, y, z, spin) {
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(radius, 24, 16),
    new THREE.MeshLambertMaterial({ color, flatShading: true })
  );
  m.position.set(x, y, z);
  m.userData.spin = spin;
  scene.add(m);
  return m;
}
const planets = [
  makePlanet(6,   0x3a6ea5, -14, 4, -20, 0.10),   // 푸른 행성
  makePlanet(3.5, 0xc4693d,  16, -6, -35, 0.15),  // 붉은 행성
  makePlanet(2,   0x9a9a9a,  -2, -9,  -5, 0.20),  // 달
];
// 푸른 행성에 고리
const ring = new THREE.Mesh(
  new THREE.RingGeometry(8, 11, 48),
  new THREE.MeshBasicMaterial({ color: 0x8899bb, side: THREE.DoubleSide, transparent: true, opacity: 0.35 })
);
ring.rotation.x = Math.PI / 2.3;
planets[0].add(ring);

// 우주선 (몸체 + 날개 + 엔진)
const ship = new THREE.Group();
const hullMat = new THREE.MeshLambertMaterial({ color: 0xcfd6e0 });
const body = new THREE.Mesh(new THREE.ConeGeometry(0.5, 2.4, 8), hullMat);
body.rotation.z = -Math.PI / 2;                       // 코가 +X 방향
ship.add(body);
const wings = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.08, 2.6), new THREE.MeshLambertMaterial({ color: 0x8a93a3 }));
wings.position.x = -0.5;
ship.add(wings);
const engine = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.35, 0.6, 8), new THREE.MeshLambertMaterial({ color: 0x555b66 }));
engine.rotation.z = Math.PI / 2;
engine.position.x = -1.3;
ship.add(engine);
const flame = new THREE.Mesh(new THREE.ConeGeometry(0.22, 1.2, 8), new THREE.MeshBasicMaterial({ color: 0xffaa33 }));
flame.rotation.z = Math.PI / 2;                       // 꼬리 방향으로 불꽃
flame.position.x = -2.0;
ship.add(flame);
ship.scale.setScalar(1.2);
scene.add(ship);

// 애니메이션
const clock = new THREE.Clock();
const SHIP_PERIOD = 14;      // 한 번 지나가는 데 걸리는 시간(초)
const SHIP_REST = 4;         // 사라진 뒤 대기 시간
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  for (const p of planets) p.rotation.y += p.userData.spin * dt;
  stars.rotation.y += 0.004 * dt;

  // 우주선: 왼쪽 -> 오른쪽, 약간 위아래로 흔들림
  const cycle = t % (SHIP_PERIOD + SHIP_REST);
  if (cycle < SHIP_PERIOD) {
    const k = cycle / SHIP_PERIOD;
    ship.visible = true;
    ship.position.set(-45 + 90 * k, 6 - 8 * k + Math.sin(t * 1.5) * 0.5, -8 + Math.sin(k * Math.PI) * 6);
    ship.rotation.set(Math.sin(t * 2) * 0.1, 0, -0.1);
    flame.scale.y = 0.8 + Math.random() * 0.4;
  } else {
    ship.visible = false;
  }

  // 카메라: 아주 느리게 떠다니는 움직임
  camera.position.x = Math.sin(t * 0.08) * 2.5;
  camera.position.y = Math.cos(t * 0.06) * 1.5;
  camera.lookAt(0, 0, -10);

  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
